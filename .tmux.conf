# Change the prefix key to C-a (matches the Alacritty tmux-split bindings)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal / colour
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm*:RGB"

# History
set -g history-limit 10000

# Mouse on, but without copy-mode drag
set -g mouse on
unbind -n MouseDrag1Pane
unbind -Tcopy-mode MouseDrag1Pane

# Status line
set -g status-right "%H:%M"
set -g window-status-current-style "underscore"

# Behaviour
set -g bell-action none
set -g remain-on-exit off

# Toggle between smallest and largest size when a window is visible in
# multiple places
bind F set -w window-size

# Toggle activity monitoring and pane synchronisation
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

# Kill the current pane
bind-key x kill-pane
