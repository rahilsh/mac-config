name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          additional_files: "install.sh"
          ignore_names: ".zshrc"
        env:
          SHELLCHECK_OPTS: -e SC1090 -e SC1091

  zsh-syntax:
    name: Zsh syntax check (.zshrc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Check .zshrc syntax
        run: zsh -n .zshrc
